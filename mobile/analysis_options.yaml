# Lints: package:flutter_lints, see https://dart.dev/lints. Suppress one case with
# `// ignore: rule_name` rather than turning a rule off here.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/generated/**
    - web/**
