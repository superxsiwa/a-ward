<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="/prototype/manifest.json">
  <link rel="icon" href="/prototype/icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">

    <symbol id="ic-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>

    <div class="sheet" id="sheet" role="status" aria-live="polite"></div>

  <script src="/prototype/data.js"></script>
